<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cindy Hsu | GenAI / LLM Application Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f7;
      --card: #ffffff;
      --ink: #1c2130;
      --muted: #64748b;
      --accent: #b45309;
      --accent-soft: #fef3e2;
      --line: #292524;
      --border: #e3e7f0;
      --mono-chip: #f1f0ec;
      --mono-chip-text: #44403c;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }

    /* --- Signature: terminal-prompt eyebrows --- */
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.02em;
      display: block;
      margin-bottom: 8px;
    }
    .eyebrow::before { content: "$ "; opacity: 0.6; }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(28, 33, 48, 0.06);
      margin-bottom: 24px;
    }

    .hero-top { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; flex-wrap: wrap; }

    .name {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.1rem, 4.2vw, 3.1rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .role {
      margin: 10px 0 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
    }

    .intro { margin-top: 16px; max-width: 780px; color: #3f3d38; }

    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--mono-chip);
      color: var(--mono-chip-text);
      border: 1px solid #ddd9d0;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      font-size: 0.92rem;
      box-shadow: 0 4px 12px rgba(28, 33, 48, 0.04);
      transition: 0.15s ease;
    }

    .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn:hover { transform: translateY(-1px); text-decoration: none; box-shadow: 0 8px 18px rgba(28, 33, 48, 0.1); }

    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
    .stack { display: grid; gap: 20px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 10px 28px rgba(28, 33, 48, 0.05);
    }

    .section-title {
      margin: 0 0 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
    }

    .small { font-size: 0.95rem; }
    .muted { color: var(--muted); }

    .pill-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      font-family: 'JetBrains Mono', monospace;
      padding: 6px 11px;
      border-radius: 8px;
      background: var(--mono-chip);
      color: var(--mono-chip-text);
      font-size: 0.82rem;
      border: 1px solid #ddd9d0;
    }
    .pill.learning { background: var(--accent-soft); color: var(--accent); border-color: #f2d9b0; }

    .entry { padding: 14px 0; border-top: 1px solid var(--border); }
    .entry:first-child { border-top: none; padding-top: 0; }
    .entry-title { font-weight: 700; color: var(--ink); }
    .entry-sub { color: var(--muted); margin-top: 4px; font-size: 0.9rem; }

    .list { margin: 0; padding-left: 18px; }
    .contact-lines p { margin: 0 0 10px; }

    .project {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      background: #fbfbfa;
    }

    .project.featured { border: 1.5px solid var(--ink); background: #fff; }

    .project-card { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }

    .project-thumb {
      width: 100%;
      max-width: 320px;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    .status-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: #16794f;
      background: #eafaf1;
      border: 1px solid #c8ecd9;
      display: inline-block;
      padding: 4px 9px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .status-line::before { content: "● "; }

    .status-line.newest {
      color: #b45309;
      background: #fef3e2;
      border-color: #f2d9b0;
    }
